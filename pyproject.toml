[project]
name = "jarvis"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "Kunal Malik", email = "kunalmalik.work@gmail.com" }
]
requires-python = ">=3.12"
dependencies = [
    "pyaudio>=0.2.14",
    "pyttsx3>=2.99",
    "setuptools>=84.0.0",
    "speechrecognition>=3.17.0",
]

[project.scripts]
jarvis = "jarvis:main"

[build-system]
requires = ["uv_build>=0.12.23,<0.13.0"]
build-backend = "uv_build"
